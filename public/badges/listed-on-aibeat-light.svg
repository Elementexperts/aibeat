<svg xmlns="http://www.w3.org/2000/svg" width="180" height="48" viewBox="0 0 180 48" role="img" aria-labelledby="title desc">
  <title id="title">Listed on AIBeat</title>
  <desc id="desc">Light badge showing that a product is listed on AIBeat.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#8B5CF6"/>
      <stop offset=".54" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="178" height="46" rx="14" fill="#FFFFFF" stroke="#D8DFEA"/>
  <rect x="10" y="10" width="28" height="28" rx="9" fill="url(#g)"/>
  <text x="24" y="29" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" text-anchor="middle">AI</text>
  <text x="48" y="22" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing=".9">LISTED ON</text>
  <text x="48" y="35" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">AIBeat</text>
