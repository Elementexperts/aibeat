  <desc id="desc">Dark badge showing that a product is listed on AIBeat.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#8B5CF6"/>
      <stop offset=".54" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
