  <text x="48" y="22" fill="#A7ADBA" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing=".9">LISTED ON</text>
  <text x="48" y="35" fill="#F7F8FA" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">AIBeat</text>
