# AIBeat - Daily News Automation
# Runs 3x per day: 07:00 / 12:00 / 18:00 UTC
# Fetches AI news -> Groq writes article -> commits MDX -> Vercel deploys

name: Daily AI News Automation

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  fetch-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync latest main before generation
        run: |
          git fetch origin main
          git pull --rebase origin main

      - name: Validate news automation secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY secret is missing. Add it in GitHub repository secrets before running Daily AI News Automation."
            exit 1
          fi

      - name: Run news automation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ARTICLE_LIMIT: 1
          FAIL_ON_NEWS_ERROR: 'false'
        run: npm run news:daily

      - name: Commit and push article
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          git config user.name "AIBeat Bot"
          git config user.email "bot@aibeat.dev"

          # Sync with latest remote first
          git fetch origin main
          git pull --rebase --autostash origin main

          # Stage generated content
          git add content/articles/

          # Skip if nothing changed
          if git diff --cached --quiet; then
            echo "No new article this run (duplicate or failed). Skipping commit."
            exit 0
          fi

          NEW_FILE=$(git diff --cached --name-only | grep '^content/articles/' | head -1)
          SLUG=$(basename "$NEW_FILE" .mdx)

          git commit -m "article: ${SLUG}"
          git push origin HEAD:main

          echo "Published: ${SLUG}"
          echo "Live at: https://www.aibeat.dev/news/${SLUG}"

          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Vercel deploy hook..."
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          else
            echo "VERCEL_DEPLOY_HOOK_URL is not configured; relying on GitHub integration auto-deploy."
          fi
