name: Product Hunt Outreach Manager

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: Outreach action
        required: true
        default: create-daily-file-drafts
        type: choice
        options:
          - import-daily-file
          - create-daily-file-drafts
      max_drafts:
        description: Maximum one-recipient Kit draft broadcasts for create-daily-file-drafts
        required: false
        default: '15'

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run outreach action
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_OUTREACH_TAG_ID: ${{ vars.KIT_OUTREACH_TAG_ID }}
          KIT_DEFAULT_EMAIL_TEMPLATE_ID: ${{ vars.KIT_DEFAULT_EMAIL_TEMPLATE_ID }}
          OUTREACH_SEND_ENABLED: ${{ vars.OUTREACH_SEND_ENABLED || 'false' }}
          AUTOMATED_KIT_SEND_ENABLED: ${{ vars.AUTOMATED_KIT_SEND_ENABLED || 'false' }}
          OUTREACH_SAFETY_LIMIT: ${{ vars.OUTREACH_SAFETY_LIMIT || '25' }}
          OUTREACH_TIMEZONE: ${{ vars.OUTREACH_TIMEZONE || 'America/New_York' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.aibeat.dev' }}
          OUTREACH_ACTION: ${{ github.event_name == 'schedule' && 'create-daily-file-drafts' || inputs.action }}
          OUTREACH_MAX_DRAFTS: ${{ inputs.max_drafts || vars.DAILY_MANUAL_OUTREACH_MAX_DRAFTS || '15' }}
          DAILY_MANUAL_LEADS_FILE: data/outreach/daily-manual-leads.csv
        shell: bash
        run: |
          case "${OUTREACH_ACTION}" in
            import-daily-file)
              npm run outreach -- import-daily-file --file "${DAILY_MANUAL_LEADS_FILE}" --save
              ;;
            create-daily-file-drafts)
              npm run outreach -- create-daily-file-drafts --file "${DAILY_MANUAL_LEADS_FILE}" --limit "${OUTREACH_MAX_DRAFTS}"
              ;;
            *)
              echo "Unsupported outreach action: ${OUTREACH_ACTION}"
              exit 1
              ;;
          esac

      - name: Upload outreach store snapshot
        uses: actions/upload-artifact@v4
        with:
          name: outreach-store
          path: data/outreach/store.json
          if-no-files-found: warn

      - name: Workflow summary
        shell: bash
        env:
          OUTREACH_ACTION: ${{ github.event_name == 'schedule' && 'create-daily-file-drafts' || inputs.action }}
          OUTREACH_MAX_DRAFTS: ${{ inputs.max_drafts || vars.DAILY_MANUAL_OUTREACH_MAX_DRAFTS || '15' }}
        run: |
          {
            echo "## Product Hunt Outreach Manager"
            echo ""
            echo "- Action: ${OUTREACH_ACTION}"
            echo "- Schedule: daily at 04:30 UTC for daily manual lead drafts"
            echo "- Daily file: data/outreach/daily-manual-leads.csv"
            echo "- Max individual drafts: ${OUTREACH_MAX_DRAFTS}"
            echo "- Sending enabled: ${{ vars.OUTREACH_SEND_ENABLED || 'false' }}"
            echo "- Automated Kit sending enabled: ${{ vars.AUTOMATED_KIT_SEND_ENABLED || 'false' }}"
            echo "- Draft-first safety remains enforced by the server CLI."
            echo "- Manual menu is limited to daily CSV import and daily CSV draft creation."
          } >> "$GITHUB_STEP_SUMMARY"
