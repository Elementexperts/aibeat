name: Weekly Newsletter Preview

on:
  schedule:
    - cron: '0 16 * * 3'
  workflow_dispatch:

jobs:
  generate-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate latest-news newsletter preview
        env:
          NEWSLETTER_ARTICLE_LIMIT: '3'
          NEXT_PUBLIC_SITE_URL: 'https://www.aibeat.dev'
        run: npm run newsletter:preview
      - name: Create Gmail draft when explicitly enabled
        env:
          NEWSLETTER_ARTICLE_LIMIT: '3'
          NEXT_PUBLIC_SITE_URL: 'https://www.aibeat.dev'
          GMAIL_CREATE_DRAFT_ENABLED: ${{ vars.GMAIL_CREATE_DRAFT_ENABLED || 'false' }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_DRAFT_TO: ${{ vars.GMAIL_DRAFT_TO }}
          GMAIL_FROM_NAME: ${{ vars.GMAIL_FROM_NAME || 'AIBeat' }}
          GMAIL_FROM_EMAIL: ${{ vars.GMAIL_FROM_EMAIL }}
        run: npm run newsletter:gmail-draft
      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aibeat-weekly-newsletter-preview
          path: artifacts/newsletter/
          if-no-files-found: error
          retention-days: 14
