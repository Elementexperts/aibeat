name: AIBeat Daily Lead Discovery

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run discovery without writing leads to the daily outreach queue
        required: true
        default: false
        type: boolean
      max_leads:
        description: Maximum qualified leads to add to daily outreach queue
        required: false
        default: '30'

concurrency:
  group: outreach-lead-queue
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run outreach tests
        run: node --import tsx --test tests/daily-outreach-drafts.test.ts tests/daily-lead-discovery.test.ts tests/gmail-scheduled-drafts.test.ts

      - name: Run daily lead discovery
        id: discovery
        continue-on-error: true
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_OUTREACH_TAG_ID: ${{ vars.KIT_OUTREACH_TAG_ID }}
          KIT_DEFAULT_EMAIL_TEMPLATE_ID: ${{ vars.KIT_DEFAULT_EMAIL_TEMPLATE_ID }}
          OUTREACH_SEND_ENABLED: 'false'
          AUTOMATED_KIT_SEND_ENABLED: 'false'
          OUTREACH_SAFETY_LIMIT: ${{ vars.OUTREACH_SAFETY_LIMIT || '25' }}
          OUTREACH_TIMEZONE: ${{ vars.OUTREACH_TIMEZONE || 'America/New_York' }}
          DAILY_LEAD_DISCOVERY_SOURCES: ${{ vars.DAILY_LEAD_DISCOVERY_SOURCES || 'product_hunt,betalist' }}
          DAILY_LEAD_DISCOVERY_FEED_URL: ${{ vars.DAILY_LEAD_DISCOVERY_FEED_URL || 'https://www.producthunt.com/feed' }}
          DAILY_LEAD_DISCOVERY_BETALIST_URL: ${{ vars.DAILY_LEAD_DISCOVERY_BETALIST_URL || 'https://betalist.com' }}
          DAILY_LEAD_DISCOVERY_LOOKBACK_HOURS: ${{ vars.DAILY_LEAD_DISCOVERY_LOOKBACK_HOURS || '48' }}
          DAILY_LEAD_DISCOVERY_MAX_CANDIDATES: ${{ vars.DAILY_LEAD_DISCOVERY_MAX_CANDIDATES || '30' }}
          DAILY_LEAD_DISCOVERY_MAX_LEADS: ${{ inputs.max_leads || vars.DAILY_LEAD_DISCOVERY_MAX_LEADS || '30' }}
          DAILY_LEAD_DISCOVERY_MIN_SCORE: ${{ vars.DAILY_LEAD_DISCOVERY_MIN_SCORE || '70' }}
          DAILY_LEAD_DISCOVERY_CREATE_DRAFTS: 'false'
          DAILY_MANUAL_LEADS_FILE: data/outreach/daily-manual-leads.csv
          DAILY_LEAD_DISCOVERY_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.aibeat.dev' }}
        run: npm run leads:daily -- --max-leads "${DAILY_LEAD_DISCOVERY_MAX_LEADS}"

      - name: Configure draft checkpoints
        if: github.event_name == 'schedule' || inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create daily individual Gmail drafts
        id: drafts
        if: github.event_name == 'schedule' || inputs.dry_run != true
        continue-on-error: true
        env:
          GMAIL_OUTREACH_DRAFTS_ENABLED: ${{ vars.GMAIL_OUTREACH_DRAFTS_ENABLED || 'false' }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_FROM_NAME: AIBeat
          GMAIL_FROM_EMAIL: ${{ vars.GMAIL_FROM_EMAIL || 'hello@aibeat.dev' }}
          SUBMISSIONS_SUPABASE_URL: ${{ vars.SUBMISSIONS_SUPABASE_URL }}
          SUBMISSIONS_SUPABASE_KEY: ${{ secrets.SUBMISSIONS_SUPABASE_KEY }}
        run: npm run outreach:gmail-drafts

      - name: Persist outreach queue and history
        if: github.event_name == 'schedule' || inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/outreach/daily-manual-leads.csv data/outreach/gmail-draft-ledger.json
          if [ -f data/outreach/daily-manual-leads.history.csv ]; then
            git add -- data/outreach/daily-manual-leads.history.csv
          fi
          if git diff --cached --quiet; then
            echo "No outreach queue changes."
            exit 0
          fi
          git commit -m "chore(outreach): sync daily lead queue"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Upload daily lead report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-lead-discovery-report
          path: |
            data/outreach/reports/*.json
            data/outreach/reports/*.md
            data/outreach/store.json
            data/outreach/daily-manual-leads.csv
            data/outreach/daily-manual-leads.history.csv
            data/outreach/gmail-draft-ledger.json
          if-no-files-found: warn

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## AIBeat Daily Lead Discovery"
            echo ""
            echo "- Schedule: daily at 04:00 UTC"
            echo "- Production sending: disabled"
            echo "- CSV: daily eligible leads and backlog prepared as individual unsent drafts; failures remain pending"
            echo "- Reports: uploaded as workflow artifacts"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report processing failures
        if: always() && (steps.discovery.outcome == 'failure' || steps.drafts.outcome == 'failure')
        run: exit 1
