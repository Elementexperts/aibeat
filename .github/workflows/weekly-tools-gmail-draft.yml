name: Friday Weekly Tools Gmail Draft

on:
  schedule:
    # 21:00 Asia/Tashkent (UTC+5).
    - cron: '0 16 * * 5'
  workflow_dispatch:
    inputs:
      tool_slugs:
        description: 'Optional: exactly eight comma-separated tool slugs for this manual run'
        required: false
        type: string

concurrency:
  group: weekly-tools-gmail-draft
  cancel-in-progress: false

jobs:
  create-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check newsletter formatting and draft behavior
        run: node --import tsx --test tests/gmail-scheduled-drafts.test.ts tests/latest-news-newsletter.test.ts
      - name: Create unsent weekly tools draft
        env:
          GMAIL_WEEKLY_TOOLS_DRAFT_ENABLED: ${{ vars.GMAIL_WEEKLY_TOOLS_DRAFT_ENABLED || 'false' }}
          # Scheduled runs always use the latest featured directory entries.
          WEEKLY_TOOL_SLUGS: ${{ inputs.tool_slugs || '' }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          # One internal reviewer only. This workflow does not manage an audience.
          GMAIL_DRAFT_TO: ${{ vars.GMAIL_WEEKLY_TOOLS_REVIEW_TO || vars.GMAIL_DRAFT_TO }}
          GMAIL_FROM_NAME: ${{ vars.GMAIL_FROM_NAME || 'AIBeat' }}
          GMAIL_FROM_EMAIL: ${{ vars.GMAIL_FROM_EMAIL || 'hello@aibeat.dev' }}
        run: npm run newsletter:weekly-tools-draft
